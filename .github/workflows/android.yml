
name: Build Max TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto Max TV
        run: |
          unzip MaxTV-Android-v1.2.2-GitHub-Actions.zip -d /tmp/maxtv
          cp -R /tmp/maxtv/MaxTV-Android/. .

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MaxTV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
